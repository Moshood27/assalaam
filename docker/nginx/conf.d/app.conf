server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 1. SET THE PRIMARY ROOT TO LARAVEL'S PUBLIC FOLDER
    root /var/www/html/public;
    index index.php index.html;

    # 2. VUE FRONTEND (Built files)
    # This handles everything starting with /app/
    location /app/ {
        # We use 'root' because the physical folder is /var/www/html/public/app
        root /var/www/html/public;
        index index.html;

        # Ensure that if a file isn't found, it sends the Vue index.html
        # This fixes Vue Router refreshes and prevents 403/404 errors
        try_files $uri $uri/ /app/index.html;

        # Fix for MIME type errors: Ensure JS and CSS are served correctly
        location ~* ^/app/assets/.*$ {
            root /var/www/html/public;
            include /etc/nginx/mime.types;
            expires 1y;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
            access_log off;
        }
    }

    # 3. LARAVEL BACKEND (Welcome page, API, Admin, Livewire)
    # Matches everything EXCEPT /app/
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. PHP-FPM PROCESSING (For Laravel, Livewire, and Filament)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 'app' MUST match your service name in docker-compose.yml
        fastcgi_pass app:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # IMPORTANT: Tells Laravel we are on HTTPS to fix Mixed Content errors
        fastcgi_param HTTPS on;

        # Increase buffers for Filament and Livewire complex requests
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 5. STORAGE & ASSETS
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # 6. SECURITY & OPTIMIZATION
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 64M;
}