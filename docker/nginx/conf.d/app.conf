server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Redirect bare /app to /app/ for SPA base path consistency
    location = /app {
        return 301 /app/;
    }

    # Serve exact /app/ with no-cache HTML to avoid stale hashed assets
    location = /app/ {
        # Always serve the latest SPA HTML
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /app/index.html =404;
    }

    # 1. VUE FRONTEND (all other files under /app/)
    location /app/ {
        root /var/www/html/public;
        index index.html;
        try_files $uri $uri/ /app/index.html;

        # MIME TYPE FIX: Force Nginx to identify JS/CSS correctly
        location ~* \.(?:js|css|json|map|svg|png|jpg|jpeg|gif|ico)$ {
            root /var/www/html/public;
            include /etc/nginx/mime.types;
            add_header Cache-Control "public, max-age=31536000";
            access_log off;
        }
    }

    # Ensure fresh SPA HTML: don't cache index.html so asset hashes stay in sync
    location = /app/index.html {
        root /var/www/html/public;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # 2. LARAVEL BACKEND (Welcome, API, Admin)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM (The logic engine)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # This tells Laravel it is secure (fixes login redirects)
        fastcgi_param HTTPS on;

        # Prevents 502 errors on large Filament forms
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 4. STORAGE
    # Correct alias mapping: both location and alias end with a trailing slash
    # so /storage/upload/file.jpg maps to /var/www/html/storage/app/public/upload/file.jpg
   location /storage/ {
           # This maps the URL /storage/ to the physical folder storage/app/public/
           alias /var/www/html/storage/app/public/;
           try_files $uri $uri/ =404;

           # Ensure correct headers for images
           location ~* \.(?:jpg|jpeg|gif|png|ico|webp)$ {
               access_log off;
               expires max;
               add_header Cache-Control "public";
           }
       }

    # When alias cannot find the file, delegate to Laravel which can serve from storage disk
    # and has a public/ fallback for legacy files.
    location @laravel_storage_fallback {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
