server {
    listen 80;
    server_name _;

    # Default root for Laravel (so it can find Livewire/Filament assets)
    root /var/www/html/public;
    index index.php index.html;

    # 1. HANDLE BACKEND: Explicitly route Laravel/Livewire paths
    # Add any other Laravel routes you have here
    location ~ ^/(api|admin|livewire|filament|login|register|logout) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. HANDLE FRONTEND: Everything else goes to the Vue App
    location / {
        # Tell Nginx to look in the Vue 'app' build folder
        root /var/www/html/public/app;
        try_files $uri $uri/ /index.html;
    }

    # 3. PHP-FPM: How Nginx talks to your Laravel container
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # This fixes HTTPS detection for Livewire/Laravel
        fastcgi_param HTTPS on;
    }

    # 4. STORAGE: Access to uploaded files
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }
}
