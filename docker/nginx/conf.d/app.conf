server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # 1. VUE FRONTEND
    location /app/ {
        root /var/www/html/public;
        index index.html;
        try_files $uri $uri/ /app/index.html;

        # MIME TYPE FIX: Force Nginx to identify JS/CSS correctly
        location ~* \.(?:js|css|json|map|svg|png|jpg|jpeg|gif|ico)$ {
            root /var/www/html/public;
            include /etc/nginx/mime.types;
            add_header Cache-Control "public, max-age=31536000";
            access_log off;
        }
    }

    # 2. LARAVEL BACKEND (Welcome, API, Admin)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM (The logic engine)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # This tells Laravel it is secure (fixes login redirects)
        fastcgi_param HTTPS on;

        # Prevents 502 errors on large Filament forms
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 4. STORAGE
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }
}
