server {
    listen 80;
    server_name _; # Responds to any host name passed by the proxy
    root /var/www/html/public;
    index index.php index.html;

    # Serve the built Vue app from /public/app for web version
    location /app/ {
        alias /var/www/html/public/app/;
        try_files $uri $uri/ /app/index.html; # Added fallback for Vue Router
    }

    # Main Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000; # Ensure this matches your service name in docker-compose.yml
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # IMPORTANT: Tell Laravel we are using HTTPS even though the proxy talks to us via HTTP
        fastcgi_param HTTPS on;
        
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20M;
}