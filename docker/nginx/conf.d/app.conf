map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # --- PROXY SETTINGS ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;

    # --- PERFORMANCE ENHANCEMENTS ---
    # 1. GZIP COMPRESSION (Makes your JS/CSS 70% smaller)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # 2. OPTIMIZED BUFFERS (Prevents slow disk-writing for large requests)
    client_max_body_size 64M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- REVERB WEBSOCKET ---
    location ~* "^/app/[a-zA-Z0-9]{16,64}$" {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
    }

    # Redirect bare /app to /app/
    location = /app {
        return 301 /app/;
    }

    # Serve exact /app/ with no-cache HTML
    location = /app/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /app/index.html =404;
    }

    # Ensure index.html is never cached (even when served via try_files from /app/ subroutes)
    location = /app/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        root /var/www/html/public;
        internal;
    }

    # --- REVERB REST API ---
    location /apps/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 1. VUE FRONTEND & STATIC ASSETS
    location /app/ {
        root /var/www/html/public;
        index index.html;
        try_files $uri $uri/ /app/index.html;

        # AGGRESSIVE CACHING for Hashed Vite Assets (Speed up repeat visits)
        location ~* \.(?:js|css|json|map|svg|png|jpg|jpeg|gif|ico|woff2|webp)$ {
            root /var/www/html/public;
            include /etc/nginx/mime.types;
            # Since Vite uses hashes (index-xxx.js), these files never change. Cache for 1 year.
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
        }
    }

    # 2. LARAVEL BACKEND
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM (The logic engine)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param HTTPS on;

        # Performance Tweaks for PHP
        fastcgi_read_timeout 300;
        fastcgi_keep_conn on;
    }

    # 4. STORAGE OPTIMIZATION
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;

        location ~* \.(?:jpg|jpeg|gif|png|ico|webp)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    location /storage/upload/ {
        alias /var/www/html/public/upload/;
        try_files $uri $uri/ =404;

        location ~* \.(?:jpg|jpeg|gif|png|ico|webp)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    location @laravel_storage_fallback {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/telescope-api {
        try_files $uri $uri/ /index.php?$query_string;
    }
}