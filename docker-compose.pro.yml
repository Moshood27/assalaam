services:
  proxy:
    image: nginx:1.25-alpine
    container_name: islamcoop-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - islamcoop-network
      - gateway-network
    depends_on:
      - app

  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: islamcoop-app
    restart: unless-stopped
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
    networks:
      - islamcoop-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: islamcoop-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - islamcoop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

networks:
  islamcoop-network:
    driver: bridge
  gateway-network:
    external: true

volumes:
  db-data:
    driver: local