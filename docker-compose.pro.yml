version: '3.8'

services:
  # 1. Internal Nginx: Receives traffic from the Global Proxy
  proxy:
    image: nginx:1.25-alpine
    container_name: islamcoop-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app # Your Vue build files
      - ./docker/nginx/conf.d:/etc/nginx/conf.d # Your project nginx config
    networks:
      - islamcoop-network
      - gateway-network # This allows the Global Proxy to find this container
    depends_on:
      app:
        condition: service_healthy

  # 2. PHP Application
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: islamcoop-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
    networks:
      - islamcoop-network
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  # 3. Database (MySQL)
  db:
    image: mysql:8.4
    container_name: islamcoop-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - islamcoop-db-data:/var/lib/mysql
    networks:
      - islamcoop-network
      - gateway-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

networks:
  islamcoop-network: # Private internal network
    driver: bridge
  gateway-network: # Shared network with Nginx Proxy Manager
    external: true

volumes:
  islamcoop-db-data:
    driver: local