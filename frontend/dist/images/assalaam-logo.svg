<?xml version="1.0" encoding="UTF-8"?>
<svg width="360" height="90" viewBox="0 0 360 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ATTAQWA CO-OPERATIVE Logo</title>
  <desc id="desc">Logo for ATTAQWA CO-OPERATIVE with an Islamic crescent mark and wordmark</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(16,18)">
    <circle cx="18" cy="18" r="18" fill="url(#g1)"/>
    <path d="M30 12a12 12 0 1 1-18 12 14 14 0 0 0 18-12z" fill="#065f46" opacity=".9"/>
    <circle cx="32" cy="6" r="2" fill="#065f46"/>
  </g>
  <!-- Wordmark -->
  <g fill="#065f46" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-weight="800" letter-spacing="4">
    <text x="88" y="38" font-size="28">ATTAQWA</text>
    <text x="88" y="68" font-size="18" font-weight="700" letter-spacing="6" opacity="0.85">CO-OPERATIVE</text>
  </g>
</svg>
