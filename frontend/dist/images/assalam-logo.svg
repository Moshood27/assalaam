<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="64" viewBox="0 0 256 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ASSALAM CO-OPERATIVE Logo</title>
  <desc id="desc">An Islamic cooperative logo with an 8-point star, crescent and dot, and the text ASSALAM CO-OPERATIVE.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(8,8)">
    <!-- 8-point star -->
    <g transform="translate(0,0)">
      <polygon points="24,0 28,12 40,16 28,20 24,32 20,20 8,16 20,12" fill="url(#g)" opacity="0.25"/>
      <polygon points="24,2 30,12 40,14 30,18 24,30 18,18 8,14 18,12" fill="url(#g)" opacity="0.5"/>
      <circle cx="24" cy="16" r="14" fill="#ECFDF5"/>
      <!-- Crescent -->
      <path d="M34 16c0 6.627-5.373 12-12 12-3.61 0-6.84-1.61-9-4.15 2.02 1.06 4.32 1.65 6.76 1.65 8.01 0 14.5-6.49 14.5-14.5 0-2.44-.6-4.74-1.65-6.76C32.39 9.16 34 12.39 34 16Z" fill="#047857"/>
      <circle cx="31" cy="12" r="1.8" fill="#10B981"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(72,16)">
    <text x="0" y="18" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#064E3B" letter-spacing="1.5">ASSALAM</text>
    <text x="0" y="38" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#065F46" letter-spacing="2">CO-OPERATIVE</text>
  </g>
</svg>