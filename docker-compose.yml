services:
  proxy:
    image: nginx:1.25-alpine
    container_name: attaqwa-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      - app

  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-app
    restart: unless-stopped
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      db: # Updated from mysql to db
        condition: service_healthy

  db: # Service name now matches your .env DB_HOST=db
    image: mysql:8.4
    container_name: attaqwa-db # Using 'db' to avoid 'mysql' name conflict
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - old-db-data:/var/lib/mysql # Points to the volume with your data
    networks:
      - attaqwa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: attaqwa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ANIbaba1122?}
    networks:
      - attaqwa-network

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-worker
    restart: unless-stopped
    command: php artisan horizon
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      - db # Updated from mysql to db
      - app

  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      - app

networks:
  attaqwa-network:
    driver: bridge
  gateway-network:
    external: true

volumes:
  # This tells Docker to use the existing volume 'coop2_db-data'
  old-db-data:
    external: true
    name: coop2_db-data