version: '3.8'

services:
  # --- 1. WEB PROXY (Nginx) ---
  proxy:
    image: nginx:1.25-alpine
    container_name: attaqwa-nginx
    restart: unless-stopped
#    ports:
#      - "80:80"
#      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      app:
        condition: service_healthy

  # --- 2. PHP-FPM APP ---
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
    networks:
      - attaqwa-network
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --- 3. QUEUE WORKER (Crucial for Paystack) ---
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file: [ ".env" ]
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      app:
        condition: service_started

  # --- 4. DATABASE ---
  db:
    image: mysql:8.4
    container_name: attaqwa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - attaqwa-db-data:/var/lib/mysql
    networks:
      - attaqwa-network
      - gateway-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

  # --- 5. REDIS ---
  redis:
    image: redis:alpine
    container_name: attaqwa-redis
    restart: unless-stopped
    networks:
      - attaqwa-network
      - gateway-network

  # --- 6. FRONTEND (Vite Dev) ---
  frontend:
    image: node:20-alpine
    container_name: attaqwa-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_PROXY_TARGET=http://proxy
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    networks:
      - attaqwa-network
      - gateway-network

networks:
  attaqwa-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1350

volumes:
  attaqwa-db-data:
    driver: bridge
  gateway-network:
    external: true
