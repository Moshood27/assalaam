services:
  # 1. Internal Nginx (The bridge between Global Proxy and your Code)
  proxy:
    image: nginx:1.25-alpine
    container_name: islamcoop-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app # Your built Vue files
      - ./docker/nginx/conf.d:/etc/nginx/conf.d # Your routing rules
    networks:
      - islamcoop-network
      - gateway-network # Joins the Global Proxy network
    depends_on:
      app:
        condition: service_started

  # 2. PHP-FPM Application (Laravel)
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile # The one we updated with 'intl'
    container_name: islamcoop-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
    networks:
      - islamcoop-network
    depends_on:
      db:
        condition: service_healthy

  # 3. Queue Worker (Processes payments and background tasks)
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: islamcoop-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file: [ ".env" ]
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - islamcoop-network
    depends_on:
      - app

  # 4. Database (MySQL 8.4)
  db:
    image: mysql:8.4
    container_name: islamcoop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - islamcoop-db-data:/var/lib/mysql
    networks:
      - islamcoop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Redis (Cache and Queue driver)
  redis:
    image: redis:alpine
    container_name: islamcoop-redis
    restart: unless-stopped
    networks:
      - islamcoop-network

networks:
  islamcoop-network: # Private internal project network
    driver: bridge
  gateway-network: # Shared network with Nginx Proxy Manager
    external: true

volumes:
  islamcoop-db-data:
    driver: local