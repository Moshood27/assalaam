services:
  # 1. Internal Nginx
  proxy:
    image: nginx:1.25-alpine
    container_name: attaqwa-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - attaqwa-network
      - gateway-network
    depends_on:
      - app

  # 2. PHP Application
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-app
    restart: unless-stopped
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
    networks:
      - attaqwa-network
      # REMOVED gateway-network for security (only proxy needs it)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 3. Database (MySQL)
  db:
    image: mysql:8.4
    container_name: attaqwa-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - attaqwa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

  # 4. ADDED: Private Redis for this project
  redis:
    image: redis:alpine
    container_name: attaqwa-redis # Specific name to avoid conflicts
    command: redis-server --requirepass ${REDIS_PASSWORD:-ANIbaba1122?}
    networks:
      - attaqwa-network

networks:
  attaqwa-network:
    driver: bridge
  gateway-network:
    external: true

volumes:
  db-data:
    driver: local