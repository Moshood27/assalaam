services:
  proxy:
    image: nginx:1.25-alpine
    container_name: assalaam-nginx
    # container_name removed to avoid conflict
    restart: unless-stopped
    ports:
      - "8090:80" # Access this second project via port 8090
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - assalaam-network
      - gateway-network
    depends_on:
      - app

  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    restart: unless-stopped
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - assalaam-network
      - gateway-network
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Use a unique folder name to avoid the "Lock Error 11"
      - ./mysql_data_v2:/var/lib/mysql
    networks:
      - assalaam-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-ANIbaba1122?}
    networks:
      - assalaam-network

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan horizon
    env_file: [ ".env" ]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - assalaam-network
    depends_on:
      - mysql
      - app

  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - assalaam-network
    depends_on:
      - app

networks:
  assalaam-network: # Fixed typo in name
    driver: bridge
  gateway-network:
    external: true