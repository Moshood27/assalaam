# Nginx configuration for ATTAQWA Cooperative (production)

# HTTP server (you may redirect to HTTPS in production once certificates are installed)
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Serve the built Vue app from /public/app for web version
    location /app/ {
        alias /var/www/html/public/app/;
        try_files $uri $uri/ =404;
    }

    # Allow well-known ACME challenges for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html/public;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000; # PHP-FPM service name from docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Security headers (adjust as needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    client_max_body_size 20M;
}

