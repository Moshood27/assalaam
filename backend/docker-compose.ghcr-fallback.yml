services:
  laravel.test:
    image: webdevops/php-nginx:8.3
    environment:
      WEB_DOCUMENT_ROOT: /var/www/html/public
      APP_SERVICE_BIND_ADDR: 0.0.0.0
    volumes:
      - .:/var/www/html

  worker:
    image: webdevops/php-nginx:8.3
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
