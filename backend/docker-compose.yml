services:
  # --- Laravel Backend (PHP 8.4) ---
  laravel.test:
    build:
      # Changed from 8.5 to 8.4
      context: './vendor/laravel/sail/runtimes/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.4/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8080}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
#      - 'laravel-storage:/var/www/html/storage'
#      - 'laravel-cache:/var/www/html/bootstrap/cache'
    networks:
      - sail
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # --- Vue Frontend (Vite) ---
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    environment:
      - VITE_PROXY_TARGET=http://laravel.test
    # Added --legacy-peer-deps to fix the ApexCharts dependency conflict
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - '${FRONTEND_PORT:-5174}:5174'
    networks:
      - sail
    depends_on:
      - laravel.test

  # --- Database (MySQL 8.4) ---
  mysql:
    image: 'mysql:8.4'
    ports:
      - '${FORWARD_DB_PORT:-33060}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  # --- Redis ---
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  # --- Mailpit ---
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - sail
  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: attaqwa-reverb
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    env_file: [ ".env" ]
    networks:
      - attaqwa-network
    restart: unless-stopped

networks:
  sail:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1350 # Stay at 1350 for better stability

volumes:
  sail-mysql:
    driver: local
  sail-redis:
    driver: local
  laravel-storage:
    driver: local
  laravel-cache:
    driver: local
